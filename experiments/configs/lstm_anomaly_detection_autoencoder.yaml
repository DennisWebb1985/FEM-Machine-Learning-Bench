experiment:
  name: lstm_anomaly_detection_autoencoder

paths:
  data_dir: data/raw/anomaly_detection
  output_dir: outputs/lstm_anomaly_detection/autoencoder/final

data:
  train_ratio: 0.7
  val_ratio: 0.15
  downsample_factor: 5
  drop_channels:
    - ch_12
    - ch_23
    - ch_24
    - ch_26
  missing_sentinel: -1000000.0
  extreme_value_threshold: 1.0e12

window:
  length: 256
  stride: 128
  drop_nan_windows: true

training:
  batch_size: 128
  epochs: 25
  lr: 0.001
  weight_decay: 0.0005
  patience: 6
  grad_clip: 1.0
  num_workers: 0
  min_delta: 0.0001

model:
  hidden_size: 64
  latent_size: 32
  num_layers: 1
  dropout: 0.1

evaluation:
  threshold_quantiles:
    - 0.95
    - 0.99
