paths:
  data_dir: "data/raw/cnn"
  output_dir: "outputs/cnn/full_cpu_1epoch"

data:
  class_names:
    - "Negative"
    - "Positive"
  file_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
  image_size: 128
  grayscale: false
  train_ratio: 0.70
  val_ratio: 0.15
  max_samples_per_class: null
  normalize_mean:
    - 0.5
    - 0.5
    - 0.5
  normalize_std:
    - 0.5
    - 0.5
    - 0.5

augmentation:
  horizontal_flip_prob: 0.5

model:
  conv_channels:
    - 32
    - 64
    - 128
  hidden_dim: 128
  dropout: 0.3

training:
  seed: 42
  batch_size: 128
  epochs: 1
  patience: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: null
  num_workers: 0
  label_smoothing: 0.0
  monitor_metric: "val_macro_f1"
  monitor_mode: "max"

shap:
  enabled: true
  background_size: 16
  num_explain_samples: 8
